async function startOCR(){
  const img = document.getElementById("img").files[0];
  if(!img){ alert("Upload prescription"); return; }

  document.getElementById("text").innerText="Reading...";
  document.getElementById("info").innerText="";

  const { data:{ text } } = await Tesseract.recognize(img,"eng");
  document.getElementById("text").innerText=text;

  detectMedicine(text);
}

function detectMedicine(text){
  const words = text
    .toLowerCase()
    .replace(/[^a-z\s]/g," ")
    .split(/\s+/);

  // common non-medicine words to ignore
  const blacklist = [
    "tablet","tablets","capsule","capsules","mg","ml",
    "morning","night","daily","after","before","food"
  ];

  const candidates = [...new Set(words)]
    .filter(w => w.length > 5 && !blacklist.includes(w));

  document.getElementById("info").innerHTML = "";

  if(candidates.length === 0){
    document.getElementById("info").innerText =
      "No medicine detected clearly.";
    return;
  }

  candidates.slice(0,4).forEach(med => fetchWiki(med));
}


async function fetchWiki(term){
  const url =
    `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(term)}`;

  try{
    const res = await fetch(url);
    if(!res.ok) return;

    const data = await res.json();
    if(!data.extract) return;

    parseMedicalText(term, data.extract);

  }catch{
    console.warn("Wiki failed for", term);
  }
}


function parseMedicalText(name, text){
  const lower = text.toLowerCase();

  const usage = extractSentence(lower, ["used","treat","relief"]);
  const side = extractSentence(lower, ["side effect","may cause","adverse"]);
  const precaution = extractSentence(lower, ["avoid","warning","risk"]);

  document.getElementById("info").innerHTML += `
  <div class="medicine" style="
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    margin-bottom:12px;
    background:#f9fafb;
  ">
    <h4>💊 ${name.toUpperCase()}</h4>
    <b>Usage:</b> ${usage || "Refer doctor"}<br><br>
    <b>Side effects:</b> ${side || "Not clearly mentioned"}<br><br>
    <b>Precautions:</b> ${precaution || "Consult healthcare professional"}
    <br><br>
    <small>Source: Wikipedia (educational only)</small>
  </div>
  `;
}


function extractSentence(text, keywords){
  for(const key of keywords){
    const index = text.indexOf(key);
    if(index !== -1){
      return text.substring(index, index+160)+"...";
    }
  }
  return null;
}

let map;

async function loadNearbyPharmacies(){
  const mapDiv = document.getElementById("map");
  mapDiv.style.display = "block";

  // Initialize map **after** div is visible
  if(!map){
    map = L.map("map").setView([0,0], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
  }

  // Get user location
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async pos=>{
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      map.setView([lat, lon], 13);
      L.marker([lat, lon]).addTo(map).bindPopup("You are here");

      // Fetch nearby pharmacies
      const q = `[out:json];node["amenity"="pharmacy"](around:10000,${lat},${lon});out;`;
      const res = await fetch("https://overpass-api.de/api/interpreter?data="+encodeURIComponent(q));
      const data = await res.json();

      data.elements.forEach(p=>{
        L.marker([p.lat, p.lon])
          .addTo(map)
          .bindPopup(p.tags?.name || "Medical Store");
      });
    }, err=>{
      alert("Could not get location: " + err.message);
    });
  }else{
    alert("Geolocation not supported in your browser");
  }
}

    const del=document.createElement("button");

  });

function addReminder(){
  const name=medNamePopup.value.trim();
  const time=medTimePopup.value;
  if(!name||!time) return alert("Fill all fields");
  reminders.push({name,time});
  localStorage.setItem("popupReminders",JSON.stringify(reminders));
  renderReminders();
}

function deleteReminder(i){
  reminders.splice(i,1);
  localStorage.setItem("popupReminders",JSON.stringify(reminders));
  renderReminders();
}

function addToGoogleCalendar(){
  const name=medNamePopup.value.trim();

  const text=encodeURIComponent(`Take medicine ${name} at ${time}`);
  window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}`,"_blank");
}

document.addEventListener("DOMContentLoaded", () => {
  const slides = document.querySelectorAll(".slide");
  const prevBtn = document.querySelector(".arrow.left");
  const nextBtn = document.querySelector(".arrow.right");

  let currentSlide = 0;
  let interval;

  function showSlide(index) {
    slides.forEach(slide => slide.classList.remove("active"));
    slides[index].classList.add("active");
  }

  function startAutoSlide() {
    interval = setInterval(() => {
      currentSlide = (currentSlide + 1) % slides.length;
      showSlide(currentSlide);
    }, 12000);
  }

  function resetAutoSlide() {
    clearInterval(interval);
    startAutoSlide();
  }

  nextBtn.addEventListener("click", () => {
    currentSlide = (currentSlide + 1) % slides.length;
    showSlide(currentSlide);
    resetAutoSlide();
  });

  prevBtn.addEventListener("click", () => {
    currentSlide = (currentSlide - 1 + slides.length) % slides.length;
    showSlide(currentSlide);
    resetAutoSlide();
  });

  // START SLIDER
  showSlide(currentSlide);
  startAutoSlide();
});
